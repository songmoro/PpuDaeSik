name: iOS Build Test

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tuist via Homebrew
        run: |
          brew install tuist
          tuist version

      - name: Tuist Generate
        working-directory: ./PpuDaeSik
        run: |
          tuist generate --no-open

      # === (1) tuist generate and build test ===
      - name: Build App target from xcworkspace
        working-directory: ./PpuDaeSik
        run: |
          set -o pipefail

          xcodebuild clean build \
            -workspace PpuDaeSik.xcworkspace \
            -scheme App \
            -destination "platform=iOS Simulator,OS=18.0,name=iPhone 16 Pro" \
            -resultBundlePath ResultBundle \
            | tee build.log \
            | xcpretty

          zip -r build-log.zip build.log
          zip -r ResultBundle.zip ResultBundle
          
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.zip

      - name: Upload Result Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-bundle
          path: ResultBundle.zip

      # === (2) tuist test ===
      - name: Run Tests with Tuist
        working-directory: ./PpuDaeSik
        run: |
          tuist test --platform ios
