name: iOS Build Test

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    name: Build and analyze
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set default scheme
        id: scheme
        run: |
          scheme_list=$(xcodebuild -list -json)
          default=$(echo "$scheme_list" | ruby -e "require 'json'; puts JSON.parse(STDIN.read)['project']['targets'][0]")
          echo "SCHEME=$default" >> $GITHUB_ENV
          echo "Using scheme: $default"

      - name: Detect project or workspace
        id: detect
        run: |
          if ls *.xcworkspace > /dev/null 2>&1; then
            echo "TYPE=workspace" >> $GITHUB_ENV
            echo "FILE=$(ls *.xcworkspace | head -n 1)" >> $GITHUB_ENV
          elif ls *.xcodeproj > /dev/null 2>&1; then
            echo "TYPE=project" >> $GITHUB_ENV
            echo "FILE=$(ls *.xcodeproj | head -n 1)" >> $GITHUB_ENV
          else
            echo "No .xcodeproj or .xcworkspace found"
            exit 1
          fi

      - name: Build and analyse default scheme using xcodebuild command
        run: |
          echo "Building $TYPE: $FILE with scheme: $SCHEME"
          xcodebuild clean build analyze \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 15 Pro,OS=17.0" \
            -$TYPE "$FILE" \
            | tee build.log \
            | xcpretty

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
